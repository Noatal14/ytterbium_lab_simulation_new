name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            atomsmltr/pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ./atomsmltr

      - name: Compile project modules
        run: |
          python -m compileall -q config.py lab_setup simulations studies utils workflow_api

      - name: Verify generated contracts
        run: |
          python scripts/generate_workflow_error_catalog.py --check
          python scripts/generate_ui_error_catalog.py --check
          python -m pytest -q tests/test_mot_2d_specification.py::test_checked_in_typescript_artifact_matches_generator_exactly

      - name: Run complete test suite
        run: python -m pytest -q

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run unit and launcher tests
        run: npm test

      - name: Type-check and build production frontend
        run: npm run build

  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Chromium browser and accessibility tests
        run: npx playwright test --project=desktop --project=split-screen --project=tablet --project=mobile
