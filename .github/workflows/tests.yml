name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            atomsmltr/pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ./atomsmltr

      - name: Compile project modules
        run: |
          python -m compileall -q config.py lab_setup simulations studies utils workflow_api

      - name: Run complete test suite
        run: python -m pytest -q
