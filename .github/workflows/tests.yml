name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Keep Python bytecode outside the checkout
        run: printf 'PYTHONPYCACHEPREFIX=%s/pycache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            atomsmltr/pyproject.toml

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ./atomsmltr

      - name: Compile project modules
        run: |
          python -m compileall -q config.py lab_setup simulations studies utils workflow_api

      - name: Verify generated contracts
        run: |
          python scripts/generate_workflow_error_catalog.py --check
          python scripts/generate_ui_error_catalog.py --check
          python -m pytest -q tests/test_mot_2d_specification.py::test_checked_in_typescript_artifact_matches_generator_exactly

      - name: Run complete test suite
        # Preserve per-test failure evidence even if the runner deadline expires.
        run: python -m pytest -x -vv --tb=short

  frontend-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend source
        run: npm run lint

      - name: Check formatting baseline
        run: npm run format:check

      - name: Run unit and launcher tests
        run: npm test

      - name: Type-check and build production frontend
        run: npm run build

  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            atomsmltr/pyproject.toml

      - name: Install backend dependencies for browser integration
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ./atomsmltr

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium, WebKit, and system dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser and accessibility tests
        run: npx playwright test --project=desktop --project=split-screen --project=tablet --project=desktop-webkit --project=mobile

      - name: Run browser-to-backend integration test
        run: npx playwright test --config=playwright.real-backend.config.ts

  host-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install simulation and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e ./atomsmltr
      - name: Run native host compatibility suite
        run: python scripts/check_host_compatibility.py
      - name: Show native Windows file-symlink rejection outcomes
        if: runner.os == 'Windows'
        run: python -m pytest -vv -rs tests/test_run_records.py::test_read_rejects_symlinked_record tests/test_run_results.py::test_state_symlink_and_wrong_digest_are_rejected
      - name: Compare real serial and spawn simulation results
        run: python scripts/smoke_host_simulations.py
      - name: Install browser test dependencies
        working-directory: ui
        run: |
          npm ci
          npx playwright install chromium
      - name: Exercise browser workflows and real HTTP boundary
        working-directory: ui
        run: |
          npx playwright test --project=desktop --workers=2
          npx playwright test --config=playwright.real-backend.config.ts
